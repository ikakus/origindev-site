<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fret Radius Sander</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="sander.css">
</head>
<body>

<header>
  <h1>FRET RADIUS SANDER</h1>
  <span>Parametric Luthier Tool · STL Export</span>
</header>

<div class="workspace">
  <aside class="sidebar">

    <div class="sec">Fret Radius</div>
    <div class="param">
      <div class="param-label"><span>Radius</span><span class="v" id="radVal">9.5"</span></div>
      <input type="range" id="sRadius" min="150" max="600" value="241" step="1">
    </div>
    <div class="presets">
      <button class="preset-btn" data-r="184">7.25"</button>
      <button class="preset-btn active" data-r="241">9.5"</button>
      <button class="preset-btn" data-r="254">10"</button>
      <button class="preset-btn" data-r="305">12"</button>
      <button class="preset-btn" data-r="356">14"</button>
      <button class="preset-btn" data-r="406">16"</button>
      <button class="preset-btn" data-r="457">18"</button>
      <button class="preset-btn" data-r="508">20"</button>
    </div>

    <div class="sec">Block Size</div>
    <div class="param">
      <div class="param-label"><span>Length</span><span class="v" id="lenVal">200 mm</span></div>
      <input type="range" id="sLen" min="50" max="400" value="200" step="5">
    </div>
    <div class="param">
      <div class="param-label"><span>Width</span><span class="v" id="widVal">70 mm</span></div>
      <input type="range" id="sWid" min="30" max="120" value="70" step="1">
    </div>
    <div class="param">
      <div class="param-label"><span>Height</span><span class="v" id="htVal">25 mm</span></div>
      <input type="range" id="sHt" min="8" max="60" value="25" step="1">
    </div>

    <div class="sec">Quality</div>
    <div class="param">
      <div class="param-label"><span>Arc Segments</span><span class="v" id="arcSegsVal">32</span></div>
      <input type="range" id="sArcSegs" min="4" max="128" value="32" step="2">
    </div>

    <div class="sec">View</div>
    <label class="check-row"><input type="checkbox" id="cbWire"> Wireframe</label>
    <label class="check-row"><input type="checkbox" id="cbSection"> Cross-section</label>
    <label class="check-row"><input type="checkbox" id="cbGrid" checked> Grid</label>

    <div class="sec">Export</div>
    <button class="btn btn-p" id="exportSTL">⬇ Export STL</button>
    <button class="btn btn-s" id="exportOBJ">⬇ Export OBJ</button>

    <div class="stats">
      RADIUS: <span id="sR">—</span><br>
      ARC DEPTH: <span id="sD">—</span><br>
      BLOCK: <span id="sDims">—</span><br>
      TRIANGLES: <span id="sTri">—</span>
    </div>

  </aside>

  <div id="canvas-container">
    <div class="r-display">
      <div class="r-big" id="rBig">9.5"</div>
      <div class="r-mm" id="rMm">241.3 mm</div>
      <div class="r-sag" id="rSag">arc depth: —</div>
    </div>
    <canvas id="arcDiagram" width="140" height="70"></canvas>
    <div class="hint">DRAG to rotate · SCROLL to zoom · RIGHT-DRAG to pan</div>
  </div>
</div>

<script src="sander.js"></script>
</body>
</html>
